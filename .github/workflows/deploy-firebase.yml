name: Deploy Firebase backend

on:
  push:
    branches:
      - main
    paths:
      - "firebase/**"
      - ".github/workflows/deploy-firebase.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Functions dependencies
        working-directory: firebase/function
        run: npm install

      - name: Authenticate with Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/519735246364/locations/global/workloadIdentityPools/github-actions/providers/github-actions
          service_account: github-firebase-deploy@jamb-prep-cbt.iam.gserviceaccount.com
          create_credentials_file: true
          export_environment_variables: true

      - name: Install Firebase CLI
        run: npm install -g firebase-tools@latest

      - name: Deploy Firebase backend
        working-directory: firebase
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ steps.auth.outputs.credentials_file_path }}
          GOOGLE_CLOUD_PROJECT: jamb-prep-cbt
          GCLOUD_PROJECT: jamb-prep-cbt
        run: |
          # Ensure Firebase CLI uses ADC without interactive login conflicts
          firebase logout --non-interactive || true
          
          # Run the deployment
          firebase deploy --project jamb-prep-cbt --force --debug
