name: Deploy Firebase backend

on:
  push:
    branches:
      - main
    paths:
      - "firebase/**"
      - ".github/workflows/deploy-firebase.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install Functions dependencies
        working-directory: firebase/functions
        run: npm install

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/519735246364/locations/global/workloadIdentityPools/github-actions/providers/github-actions
          service_account: github-firebase-deploy@jamb-prep-cbt.iam.gserviceaccount.com

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Deploy Firebase backend
        working-directory: firebase
        run: firebase deploy --project jamb-prep-cbt --force