<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#246b35"><link rel="stylesheet" href="css/main.css"><title>Practice Test</title></head><body><header class="app-header"><div class="brand">🎓 <span id="student">Practice Student</span></div><div><small class="muted" style="display:block;text-align:center;font-size:10px">TIME LEFT</small><strong id="timer" class="timer">30:00</strong></div><button id="submitTop" class="btn danger">Submit</button></header><main class="container"><nav id="subjects" class="subject-bar"></nav><div class="exam-layout"><section class="card"><div class="exam-meta"><span id="subject">Subject</span><span id="counter">Question 1</span></div><div class="progress-bar"><i id="progress"></i></div><h2 id="question" class="question-text">Loading questions…</h2><div id="options"></div><div class="exam-actions"><button id="prev" class="btn ghost">← Previous</button><button id="flag" class="btn ghost">⚑ Flag</button><button id="next" class="btn primary">Next →</button></div></section><aside class="card"><div style="display:flex;justify-content:space-between"><b>Question Palette</b><span id="navsummary" class="muted tiny">0/0</span></div><div id="numbers" class="palette-grid"></div><button id="submit" class="btn danger full" style="margin-top:16px">Submit Test</button></aside></div></main><dialog id="confirm"><div class="modal-body"><h3>Submit practice test?</h3><p id="confirmText" class="muted" style="margin:10px 0 18px"></p><div style="display:flex;gap:8px;justify-content:flex-end"><button id="cancel" class="btn ghost">Continue</button><button id="confirmSubmit" class="btn primary">Submit Now</button></div></div></dialog><div id="toast" class="toast"></div><script src="js/cbt.js?v=11clean"></script><footer class="site-footer">© 2026 De-Blaise Technologies. All rights reserved.</footer></body></html>
