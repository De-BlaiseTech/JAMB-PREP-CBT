<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#246b35"><link rel="stylesheet" href="css/main.css"><title>Admin Dashboard | JAMB Prep CBT"></head><body>
<header class="app-header"><div class="brand">🎓 <span>JAMB PREP CBT</span> <span class="pill">ADMIN</span></div><div class="header-actions"><a class="btn ghost" href="dashboard.html">Student Dashboard</a><button id="logout" class="btn ghost">Sign Out</button></div></header>
<main class="container" style="padding-top:28px;padding-bottom:50px">
<section class="dashboard-welcome"><div><span class="eyebrow">CONTROL CENTRE</span><h1>Administrator Dashboard</h1><p class="muted">Manage the question bank and monitor registered students.</p></div></section>
<p id="notice" class="status-msg" role="status"></p>
<section class="stats-grid" style="margin:20px 0"><div class="stat-card"><b id="questionCount">—</b><span>Questions</span></div><div class="stat-card"><b id="studentCount">—</b><span>Students</span></div><div class="stat-card"><b id="attemptCount">—</b><span>Completed mocks</span></div></section>
<section class="card section-card" style="margin:18px 0"><div class="section-heading"><div><span class="eyebrow">QUESTION BANK</span><h2 id="formTitle">Add a Question</h2></div><button id="resetForm" class="btn ghost" type="button">Clear Form</button></div>
<form id="questionForm"><input id="questionId" type="hidden"><div class="setup-grid">
<div class="field"><label for="subject">Subject</label><select id="subject" required><option>Use of English</option><option>Mathematics</option><option>Physics</option><option>Chemistry</option><option>Biology</option><option>Economics</option><option>Government</option><option>Literature in English</option><option>Financial Accounting</option><option>Commerce</option><option>Geography</option><option>Agricultural Science</option><option>Christian Religious Studies</option></select></div>
<div class="field"><label for="topic">Topic (optional)</label><input id="topic" maxlength="160"></div></div>
<div class="field"><label for="question">Question</label><textarea id="question" rows="4" required maxlength="5000"></textarea></div>
<div class="setup-grid"><div class="field"><label for="opt0">Option A</label><input id="opt0" required maxlength="1000"></div><div class="field"><label for="opt1">Option B</label><input id="opt1" required maxlength="1000"></div><div class="field"><label for="opt2">Option C</label><input id="opt2" required maxlength="1000"></div><div class="field"><label for="opt3">Option D</label><input id="opt3" required maxlength="1000"></div></div>
<div class="setup-grid"><div class="field"><label for="answer">Correct answer</label><select id="answer"><option value="0">A</option><option value="1">B</option><option value="2">C</option><option value="3">D</option></select></div><div class="field"><label for="explanation">Explanation (optional)</label><textarea id="explanation" rows="2" maxlength="5000"></textarea></div></div>
<label style="display:flex;gap:8px;align-items:center;margin:12px 0"><input id="active" type="checkbox" checked> Active (available in student practice)</label><button class="btn primary" id="saveQuestion" type="submit">Save Question</button></form></section>
<section class="card section-card" style="margin:18px 0"><div class="section-heading"><div><span class="eyebrow">QUESTION LIBRARY</span><h2>Manage Questions</h2></div><button class="btn ghost" id="refreshQuestions">Refresh</button></div><div class="field"><label for="questionSearch">Search questions</label><input id="questionSearch" placeholder="Search by question, subject or topic"></div><div id="questionList" class="history-list">Loading questions…</div></section>
<section class="card section-card" style="margin:18px 0"><div class="section-heading"><div><span class="eyebrow">REGISTERED USERS</span><h2>Students</h2></div><button class="btn ghost" id="refreshStudents">Refresh</button></div><div class="field"><label for="studentSearch">Search students</label><input id="studentSearch" placeholder="Search name, email or registration number"></div><div style="overflow-x:auto"><table style="width:100%;border-collapse:collapse;min-width:720px"><thead><tr><th align="left">Student</th><th align="left">Registration No.</th><th align="left">Joined</th><th align="right">Credits</th><th align="right">Mocks completed</th><th align="left">Status</th></tr></thead><tbody id="studentRows"><tr><td colspan="6">Loading students…</td></tr></tbody></table></div></section>
</main><footer class="site-footer">© 2026 De-Blaise Technologies. All rights reserved.</footer><script type="module" src="js/admin.js"></script></body></html>
