<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#246b35">
<link rel="stylesheet" href="css/main.css">
<title>Reset Password — JAMB Prep CBT</title>
<style>
.reset-card{max-width:520px;margin:32px auto;padding:28px 22px;background:#fff;border-radius:16px;box-shadow:0 8px 30px rgba(0,0,0,.08)}
.reset-card h1{text-align:center;margin-bottom:8px}.reset-card .sub{text-align:center;margin-bottom:24px;color:#666}
.reset-msg{min-height:24px;margin-top:16px;text-align:center;font-weight:600}.reset-msg.error,.reset-msg.info{color:#b44b4b}.reset-msg.success{color:#2e682b}
.reset-card .btn{margin-top:8px}.hidden{display:none!important}
</style>
</head>
<body class="auth-body">
<main class="reset-card">
  <div class="brand-hero">
    <div class="logo">🎓</div>
    <h1>Reset Password</h1>
    <p class="sub">De-Blaise Technologies JAMB Prep CBT</p>
  </div>
  <section id="formWrap" class="hidden">
    <div class="field"><label>New Password</label><input id="password" type="password" autocomplete="new-password" placeholder="Enter your new password"></div>
    <div class="field"><label>Confirm New Password</label><input id="confirm" type="password" autocomplete="new-password" placeholder="Confirm your new password"></div>
    <button id="resetBtn" class="btn primary full">Reset Password</button>
  </section>
  <p id="msg" class="reset-msg info">Checking your reset link…</p>
  <button id="loginBtn" class="btn secondary full hidden" type="button">Continue to Login</button>
</main>
<footer class="site-footer">© 2026 De-Blaise Technologies. All rights reserved.</footer>
<script src="js/reset-password.js"></script>
</body>
</html>
